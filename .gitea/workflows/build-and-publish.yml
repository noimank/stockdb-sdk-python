name: build-and-publish

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Smoke test (import)
        run: |
          pip install dist/*.whl
          python -c "import stockdb_sdk as sdk; print(sdk.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Publish to Gitea PyPI
        env:
          PYPI_TOKEN: ${{ secrets.GITEA_PYPI_TOKEN }}
        run: |
          pip install twine
          twine upload --repository-url https://git.c2m.fun/api/packages/stockdb/pypi \
            --username stockdb --password %PYPI_TOKEN% dist/*
