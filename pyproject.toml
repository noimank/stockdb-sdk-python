[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockdb-sdk"
version = "0.3.0"
description = "free-stockdb 项目的第三方只读 SDK：K 线查询（多周期/复权/字段投影）、板块检索，纯 HTTP 跨平台实现"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "noimank", email = "noimank@163.com" },
]
keywords = ["stock", "finance", "kline", "quant", "stockdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.24",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]

[project.urls]
Homepage = "https://github.com/hello245m/free-stockdb"
Source = "https://github.com/noimank/stockdb-sdk-python"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["stockdb_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
