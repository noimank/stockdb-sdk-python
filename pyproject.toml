[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockdb-sdk"
version = "0.1.0"
description = "StockDB 股票数据库官方 Python SDK：K 线查询、板块检索与技术指标计算"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "noimank", email = "noimank@163.com" },
]
keywords = ["stock", "finance", "kline", "indicator", "quant", "stockdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["build", "wheel", "pytest"]

[project.urls]
Homepage = "https://git.c2m.fun/stockdb/stockdb-sdk-python"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["stockdb_sdk"]

# 原生二进制扩展模块（.pyd）。setuptools 会依据它们的加载行为
# 自动将产物打为平台相关 wheel（win_amd64），而非纯 Python wheel。
[tool.setuptools.package-data]
stockdb_sdk = ["*.pyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
